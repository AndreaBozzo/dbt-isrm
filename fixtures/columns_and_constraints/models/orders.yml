models:
  - name: orders
    description: Orders with an enforced contract and column constraints.
    config:
      # Constraints are ignored on views, so this must be a table.
      materialized: table
      contract:
        enforced: true
    columns:
      - name: order_id
        description: Order identifier.
        data_type: integer
        constraints:
          - type: not_null
          - type: primary_key
      - name: customer_id
        description: Customer identifier.
        data_type: integer
        constraints:
          - type: not_null
      - name: status
        description: Fulfilment status.
        data_type: varchar
      - name: amount
        description: Order amount.
        data_type: decimal(10, 2)
