# Under `compile --static-analysis strict`, dbt downloads source schemas before
# on-run-start creates main.raw_orders, so strict analysis of stg_orders falls
# back to off (dbt1014). That is an observation, not a fixture defect.
sources:
  - name: raw
    description: Raw landing schema for the source fixture.
    schema: main
    loader: isrm_loader
    config:
      loaded_at_field: _loaded_at
    tables:
      - name: raw_orders
        description: Raw orders as landed by the loader.
        columns:
          - name: order_id
            data_type: integer
          - name: _loaded_at
            data_type: timestamp
